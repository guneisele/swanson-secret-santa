<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#143528" />
  <meta name="description" content="The Swanson Family Secret Santa 2026 — draw names and text everyone their private match." />
  <title>The Swanson Family Secret Santa 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%8E%85%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div class="snow" id="snow" aria-hidden="true"></div>

  <svg class="canes canes-left" viewBox="0 0 40 200" aria-hidden="true">
    <path d="M28 48c0-14-8-26-20-26S-12 34-12 48" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
    <path d="M28 48c0-14-8-26-20-26S-12 34-12 48" fill="none" stroke="#9A1B2C" stroke-width="14" stroke-linecap="round" stroke-dasharray="10 10"/>
    <path d="M28 48v140" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
    <path d="M28 48v140" fill="none" stroke="#9A1B2C" stroke-width="14" stroke-dasharray="10 10"/>
  </svg>
  <svg class="canes canes-right" viewBox="0 0 40 200" aria-hidden="true">
    <path d="M28 48c0-14-8-26-20-26S-12 34-12 48" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
    <path d="M28 48c0-14-8-26-20-26S-12 34-12 48" fill="none" stroke="#9A1B2C" stroke-width="14" stroke-linecap="round" stroke-dasharray="10 10"/>
    <path d="M28 48v140" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
    <path d="M28 48v140" fill="none" stroke="#9A1B2C" stroke-width="14" stroke-dasharray="10 10"/>
  </svg>

  <div class="page">
    <svg class="scene" viewBox="0 0 390 150" role="img" aria-label="Santa in a sleigh pulled by two reindeer over snowy pines">
      <defs>
        <linearGradient id="skyfade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1c4736" stop-opacity="0"/>
          <stop offset="1" stop-color="#143528" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <!-- stars -->
      <g fill="#F3D789">
        <circle cx="28" cy="18" r="1.4"/>
        <circle cx="72" cy="32" r="1.1"/>
        <circle cx="120" cy="14" r="1.5"/>
        <circle cx="168" cy="26" r="1.2"/>
        <circle cx="230" cy="12" r="1.4"/>
        <circle cx="280" cy="24" r="1.1"/>
        <circle cx="310" cy="10" r="1.3"/>
        <circle cx="60" cy="50" r="1"/>
        <path d="M200 8l1.2 2.6 2.8.4-2 2.1.5 2.8-2.5-1.4-2.5 1.4.5-2.8-2-2.1 2.8-.4z"/>
        <path d="M350 16l1 2.1 2.2.3-1.6 1.7.4 2.2-2-1.1-2 1.1.4-2.2-1.6-1.7 2.2-.3z"/>
      </g>
      <!-- moon (crescent) -->
      <path d="M352 20a16 16 0 1 0 0 32 13 13 0 1 1 0-32z" fill="#FFF6E8"/>
      <!-- distant pines -->
      <g fill="#0f2a20">
        <path d="M18 150 L36 96 L54 150Z"/>
        <path d="M48 150 L62 110 L76 150Z"/>
        <path d="M320 150 L344 92 L368 150Z"/>
        <path d="M350 150 L372 114 L390 150Z"/>
        <path d="M0 150 L16 118 L32 150Z"/>
      </g>
      <g fill="#16382C">
        <path d="M8 150 L28 102 L48 150Z"/>
        <path d="M34 150 L52 116 L70 150Z"/>
        <path d="M300 150 L326 100 L352 150Z"/>
        <path d="M338 150 L362 118 L386 150Z"/>
      </g>
      <!-- gold ornaments on a tree -->
      <circle cx="28" cy="128" r="3.2" fill="#C9A227"/>
      <circle cx="36" cy="140" r="2.6" fill="#9A1B2C"/>
      <circle cx="326" cy="126" r="3" fill="#9A1B2C"/>
      <circle cx="338" cy="138" r="2.5" fill="#F3D789"/>

      <!-- ground snow -->
      <path d="M0 146 C40 136, 90 150, 150 144 C210 138, 270 152, 330 144 C360 140, 380 146, 390 142 L390 150 L0 150Z" fill="#FFF6E8"/>

      <!-- harness -->
      <path d="M86 86 C120 78, 150 80, 186 86" fill="none" stroke="#C9A227" stroke-width="2"/>
      <path d="M86 92 C122 86, 152 88, 186 94" fill="none" stroke="#C9A227" stroke-width="1.5"/>

      <!-- lead reindeer -->
      <g transform="translate(40,70)">
        <ellipse cx="36" cy="22" rx="22" ry="10" fill="#6B3F24"/>
        <ellipse cx="16" cy="16" rx="10" ry="8" fill="#7A4A2B"/>
        <circle cx="12" cy="14" r="1.6" fill="#17241E"/>
        <path d="M14 8 Q8 -6 2 2" fill="none" stroke="#3A2416" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M14 8 Q18 -8 10 -2" fill="none" stroke="#3A2416" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M18 8 Q24 -4 20 2" fill="none" stroke="#3A2416" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M28 30 L24 46" stroke="#6B3F24" stroke-width="3" stroke-linecap="round"/>
        <path d="M40 30 L44 46" stroke="#6B3F24" stroke-width="3" stroke-linecap="round"/>
        <path d="M22 28 L16 44" stroke="#6B3F24" stroke-width="3" stroke-linecap="round"/>
        <path d="M46 26 L54 42" stroke="#6B3F24" stroke-width="3" stroke-linecap="round"/>
        <path d="M54 20 Q64 16 62 28" fill="none" stroke="#7A4A2B" stroke-width="3" stroke-linecap="round"/>
        <circle cx="8" cy="18" r="2.2" fill="#C9A227"/>
      </g>
      <!-- second reindeer -->
      <g transform="translate(108,76)">
        <ellipse cx="36" cy="22" rx="20" ry="9" fill="#5C341D"/>
        <ellipse cx="16" cy="16" rx="9" ry="7" fill="#6B3F24"/>
        <circle cx="12" cy="14" r="1.5" fill="#17241E"/>
        <path d="M14 8 Q8 -4 4 2" fill="none" stroke="#3A2416" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M14 8 Q20 -6 12 -1" fill="none" stroke="#3A2416" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M28 30 L25 44" stroke="#5C341D" stroke-width="3" stroke-linecap="round"/>
        <path d="M40 30 L43 44" stroke="#5C341D" stroke-width="3" stroke-linecap="round"/>
        <path d="M22 28 L17 42" stroke="#5C341D" stroke-width="3" stroke-linecap="round"/>
        <path d="M46 26 L52 40" stroke="#5C341D" stroke-width="3" stroke-linecap="round"/>
        <path d="M52 20 Q60 16 58 26" fill="none" stroke="#6B3F24" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- sleigh -->
      <g transform="translate(200,78)">
        <path d="M8 28 C12 8, 50 0, 86 10 L92 28 C70 36, 24 40, 8 28Z" fill="#9A1B2C"/>
        <path d="M8 28 C12 8, 50 0, 86 10 L92 28 C70 36, 24 40, 8 28Z" fill="none" stroke="#7A1220" stroke-width="1"/>
        <path d="M14 30 C40 40, 70 36, 90 28" fill="none" stroke="#C9A227" stroke-width="2"/>
        <!-- runners -->
        <path d="M6 44 C0 44, 0 34, 10 32 L96 28 C108 28, 108 40, 98 42 L10 46 C6 46, 6 44, 6 44Z" fill="none" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/>
        <path d="M28 34 L26 44" stroke="#C9A227" stroke-width="2"/>
        <path d="M70 30 L72 42" stroke="#C9A227" stroke-width="2"/>
        <!-- gifts in back -->
        <rect x="64" y="8" width="16" height="14" rx="2" fill="#2E6B50"/>
        <rect x="70" y="8" width="4" height="14" fill="#F3D789"/>
        <rect x="76" y="14" width="14" height="12" rx="2" fill="#C9A227"/>
        <rect x="81" y="14" width="3" height="12" fill="#9A1B2C"/>
      </g>

      <!-- Santa -->
      <g transform="translate(226,46)">
        <!-- body -->
        <ellipse cx="22" cy="36" rx="16" ry="14" fill="#9A1B2C"/>
        <!-- arm wave -->
        <path d="M34 32 Q48 20 54 14" fill="none" stroke="#9A1B2C" stroke-width="6" stroke-linecap="round"/>
        <circle cx="55" cy="13" r="4" fill="#F4D0B0"/>
        <!-- mittens cuff -->
        <circle cx="50" cy="16" r="3" fill="#FFF6E8"/>
        <!-- head -->
        <circle cx="22" cy="18" r="12" fill="#F4D0B0"/>
        <!-- beard -->
        <path d="M12 20 Q22 40 32 20 Q28 32 22 34 Q16 32 12 20Z" fill="#FFF8EE"/>
        <path d="M16 20 Q22 28 28 20" fill="#fff"/>
        <!-- mustache -->
        <path d="M14 22 Q22 28 30 22 Q22 24 14 22Z" fill="#FFF8EE"/>
        <!-- eyes -->
        <circle cx="17.5" cy="17" r="1.4" fill="#17241E"/>
        <circle cx="24.5" cy="17" r="1.4" fill="#17241E"/>
        <!-- nose -->
        <ellipse cx="21" cy="20.5" rx="2.2" ry="1.6" fill="#E07A6A"/>
        <!-- cheeks -->
        <circle cx="15" cy="20" r="2" fill="#F0A090" opacity="0.7"/>
        <circle cx="28" cy="20" r="2" fill="#F0A090" opacity="0.7"/>
        <!-- hat -->
        <path d="M10 14 Q22 0 34 14 Q22 10 10 14Z" fill="#9A1B2C"/>
        <path d="M10 13 Q22 8 34 13" fill="#FFF6E8"/>
        <rect x="10" y="12" width="24" height="5" rx="2.5" fill="#FFF6E8"/>
        <circle cx="34" cy="6" r="4.2" fill="#FFF6E8"/>
        <!-- belt -->
        <rect x="10" y="38" width="24" height="4" fill="#17241E"/>
        <rect x="19" y="37.5" width="6" height="5" fill="#C9A227"/>
      </g>
    </svg>

    <main id="app"></main>

    <p class="footnote" id="footnote"></p>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
