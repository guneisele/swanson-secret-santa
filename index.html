<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#143528" />
  <meta name="description" content="The Swanson Family Secret Santa 2026 — draw names and text everyone their private match." />
  <title>The Swanson Family Secret Santa 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%8E%85%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div class="snow" id="snow" aria-hidden="true"></div>

  <svg class="canes canes-left" viewBox="0 0 40 200" aria-hidden="true">
    <defs>
      <pattern id="cane-left-stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)">
        <rect width="14" height="14" fill="#FFFDF8"/>
        <rect width="6" height="14" fill="#C8243A"/>
      </pattern>
      <mask id="cane-left-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="40" height="200">
        <path d="M27 188 V40 A9.5 9.5 0 0 0 8 40 V50" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      </mask>
    </defs>
    <path d="M27 188 V40 A9.5 9.5 0 0 0 8 40 V50" fill="none" stroke="#7A1220" stroke-opacity="0.35" stroke-width="13.5" stroke-linecap="round"/>
    <rect x="0" y="0" width="40" height="200" fill="url(#cane-left-stripes)" mask="url(#cane-left-mask)"/>
    <path d="M24 184 V40 A7 7 0 0 0 11.5 36" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <svg class="canes canes-right" viewBox="0 0 40 200" aria-hidden="true">
    <defs>
      <pattern id="cane-right-stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)">
        <rect width="14" height="14" fill="#FFFDF8"/>
        <rect width="6" height="14" fill="#C8243A"/>
      </pattern>
      <mask id="cane-right-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="40" height="200">
        <path d="M27 188 V40 A9.5 9.5 0 0 0 8 40 V50" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      </mask>
    </defs>
    <path d="M27 188 V40 A9.5 9.5 0 0 0 8 40 V50" fill="none" stroke="#7A1220" stroke-opacity="0.35" stroke-width="13.5" stroke-linecap="round"/>
    <rect x="0" y="0" width="40" height="200" fill="url(#cane-right-stripes)" mask="url(#cane-right-mask)"/>
    <path d="M24 184 V40 A7 7 0 0 0 11.5 36" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>
  </svg>

  <div class="page">
    <svg class="scene" viewBox="0 0 390 150" role="img" aria-label="Santa in a sleigh pulled by two reindeer over snowy pines">
      <defs>
        <linearGradient id="skyfade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1c4736" stop-opacity="0"/>
          <stop offset="1" stop-color="#143528" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <!-- stars -->
      <g fill="#F3D789">
        <circle cx="28" cy="18" r="1.4"/>
        <circle cx="72" cy="32" r="1.1"/>
        <circle cx="120" cy="14" r="1.5"/>
        <circle cx="168" cy="26" r="1.2"/>
        <circle cx="230" cy="12" r="1.4"/>
        <circle cx="280" cy="24" r="1.1"/>
        <circle cx="310" cy="10" r="1.3"/>
        <circle cx="60" cy="50" r="1"/>
        <path d="M200 8l1.2 2.6 2.8.4-2 2.1.5 2.8-2.5-1.4-2.5 1.4.5-2.8-2-2.1 2.8-.4z"/>
        <path d="M350 16l1 2.1 2.2.3-1.6 1.7.4 2.2-2-1.1-2 1.1.4-2.2-1.6-1.7 2.2-.3z"/>
      </g>
      <!-- moon (crescent) -->
      <path d="M352 20a16 16 0 1 0 0 32 13 13 0 1 1 0-32z" fill="#FFF6E8"/>
      <!-- distant pines -->
      <g fill="#0f2a20">
        <path d="M18 150 L36 96 L54 150Z"/>
        <path d="M48 150 L62 110 L76 150Z"/>
        <path d="M320 150 L344 92 L368 150Z"/>
        <path d="M350 150 L372 114 L390 150Z"/>
        <path d="M0 150 L16 118 L32 150Z"/>
      </g>
      <g fill="#16382C">
        <path d="M8 150 L28 102 L48 150Z"/>
        <path d="M34 150 L52 116 L70 150Z"/>
        <path d="M300 150 L326 100 L352 150Z"/>
        <path d="M338 150 L362 118 L386 150Z"/>
      </g>
      <!-- gold ornaments on a tree -->
      <circle cx="28" cy="128" r="3.2" fill="#C9A227"/>
      <circle cx="36" cy="140" r="2.6" fill="#9A1B2C"/>
      <circle cx="326" cy="126" r="3" fill="#9A1B2C"/>
      <circle cx="338" cy="138" r="2.5" fill="#F3D789"/>

      <!-- ground snow -->
      <path d="M0 146 C40 136, 90 150, 150 144 C210 138, 270 152, 330 144 C360 140, 380 146, 390 142 L390 150 L0 150Z" fill="#FFF6E8"/>

      <!-- harness / reins -->
      <path d="M58 93 C88 85, 118 89, 140 97 C168 89, 194 91, 214 99" fill="none" stroke="#C9A227" stroke-width="2"/>
      <path d="M60 97 C90 91, 118 95, 142 101 C170 95, 194 97, 212 105" fill="none" stroke="#C9A227" stroke-width="1.5"/>

      <!-- lead reindeer (red nose) -->
      <g transform="translate(32,66) scale(1.12)">
        <!-- legs: far side (darker) -->
        <path d="M30 41 L22 55" stroke="#6E4426" stroke-width="3.6" stroke-linecap="round"/>
        <path d="M52 41 L62 52" stroke="#6E4426" stroke-width="3.6" stroke-linecap="round"/>
        <circle cx="21.6" cy="56" r="2.3" fill="#2B1A10"/>
        <circle cx="62.8" cy="53" r="2.3" fill="#2B1A10"/>
        <!-- tail -->
        <path d="M60 28 Q68 21 68 27 Q66 31 60 31Z" fill="#F1DDBF"/>
        <!-- body -->
        <ellipse cx="42" cy="33" rx="21" ry="11.5" fill="#8B5A33"/>
        <ellipse cx="41" cy="38.5" rx="12.5" ry="4" fill="#E8C9A0"/>
        <!-- legs: near side -->
        <path d="M26 39 L16 52" stroke="#8B5A33" stroke-width="4" stroke-linecap="round"/>
        <path d="M56 38 L68 47" stroke="#8B5A33" stroke-width="4" stroke-linecap="round"/>
        <circle cx="15.4" cy="53" r="2.5" fill="#2B1A10"/>
        <circle cx="69" cy="47.6" r="2.5" fill="#2B1A10"/>
        <!-- neck -->
        <path d="M30 31 L19 16" stroke="#8B5A33" stroke-width="10" stroke-linecap="round"/>
        <!-- antlers -->
        <g fill="none" stroke="#C8955A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 8 Q11 1 5 -3"/>
          <path d="M11.5 3 L13 -3"/>
          <path d="M8 -1 L7 -7"/>
          <path d="M18 7 Q20 -1 27 -5"/>
          <path d="M19.5 2 L16 -4"/>
          <path d="M22.5 -2 L22 -9"/>
          <path d="M25 -4 L30 -9"/>
        </g>
        <!-- ear -->
        <ellipse cx="22" cy="10" rx="5" ry="2.2" transform="rotate(-25 22 10)" fill="#8B5A33"/>
        <ellipse cx="22.4" cy="9.8" rx="3" ry="1" transform="rotate(-25 22.4 9.8)" fill="#E8C9A0"/>
        <!-- head + muzzle -->
        <ellipse cx="14" cy="14" rx="8.5" ry="7" fill="#8B5A33"/>
        <ellipse cx="6.5" cy="17" rx="6" ry="4.6" fill="#E8C9A0"/>
        <!-- eye -->
        <circle cx="13" cy="12" r="1.9" fill="#17241E"/>
        <circle cx="12.4" cy="11.4" r="0.6" fill="#fff"/>
        <!-- nose -->
        <circle cx="1.6" cy="16" r="5" fill="#FF5A6E" opacity="0.35"/>
        <circle cx="1.6" cy="16" r="2.9" fill="#E0283F"/>
        <!-- collar + bell -->
        <path d="M23 25 Q28 23 32 18" fill="none" stroke="#C9A227" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="25" cy="27" r="2.1" fill="#F3D789"/>
      </g>
      <!-- second reindeer -->
      <g transform="translate(114,70) scale(1.06)">
        <!-- legs: far side (darker) -->
        <path d="M30 41 L22 55" stroke="#613B21" stroke-width="3.6" stroke-linecap="round"/>
        <path d="M52 41 L62 52" stroke="#613B21" stroke-width="3.6" stroke-linecap="round"/>
        <circle cx="21.6" cy="56" r="2.3" fill="#2B1A10"/>
        <circle cx="62.8" cy="53" r="2.3" fill="#2B1A10"/>
        <!-- tail -->
        <path d="M60 28 Q68 21 68 27 Q66 31 60 31Z" fill="#F1DDBF"/>
        <!-- body -->
        <ellipse cx="42" cy="33" rx="21" ry="11.5" fill="#7E4F2C"/>
        <ellipse cx="41" cy="38.5" rx="12.5" ry="4" fill="#E8C9A0"/>
        <!-- legs: near side -->
        <path d="M26 39 L16 52" stroke="#7E4F2C" stroke-width="4" stroke-linecap="round"/>
        <path d="M56 38 L68 47" stroke="#7E4F2C" stroke-width="4" stroke-linecap="round"/>
        <circle cx="15.4" cy="53" r="2.5" fill="#2B1A10"/>
        <circle cx="69" cy="47.6" r="2.5" fill="#2B1A10"/>
        <!-- neck -->
        <path d="M30 31 L19 16" stroke="#7E4F2C" stroke-width="10" stroke-linecap="round"/>
        <!-- antlers -->
        <g fill="none" stroke="#C8955A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 8 Q11 1 5 -3"/>
          <path d="M11.5 3 L13 -3"/>
          <path d="M8 -1 L7 -7"/>
          <path d="M18 7 Q20 -1 27 -5"/>
          <path d="M19.5 2 L16 -4"/>
          <path d="M22.5 -2 L22 -9"/>
          <path d="M25 -4 L30 -9"/>
        </g>
        <!-- ear -->
        <ellipse cx="22" cy="10" rx="5" ry="2.2" transform="rotate(-25 22 10)" fill="#7E4F2C"/>
        <ellipse cx="22.4" cy="9.8" rx="3" ry="1" transform="rotate(-25 22.4 9.8)" fill="#E8C9A0"/>
        <!-- head + muzzle -->
        <ellipse cx="14" cy="14" rx="8.5" ry="7" fill="#7E4F2C"/>
        <ellipse cx="6.5" cy="17" rx="6" ry="4.6" fill="#E8C9A0"/>
        <!-- eye -->
        <circle cx="13" cy="12" r="1.9" fill="#17241E"/>
        <circle cx="12.4" cy="11.4" r="0.6" fill="#fff"/>
        <!-- nose -->
        <circle cx="1.6" cy="16" r="2.2" fill="#3A2416"/>
        <!-- collar + bell -->
        <path d="M23 25 Q28 23 32 18" fill="none" stroke="#C9A227" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="25" cy="27" r="2.1" fill="#F3D789"/>
      </g>

      <!-- sleigh -->
      <g transform="translate(200,78)">
        <!-- gifts in back -->
        <rect x="66" y="4" width="15" height="14" rx="2" fill="#2E6B50"/>
        <rect x="72" y="4" width="3.5" height="14" fill="#F3D789"/>
        <rect x="78" y="9" width="13" height="11" rx="2" fill="#C9A227"/>
        <rect x="83" y="9" width="3" height="11" fill="#9A1B2C"/>
        <!-- body with curled front -->
        <path d="M16 31 C10 26, 6 17, 10 10 C13 5, 20 5, 21 10 C22 14, 18 16, 22 18 L84 17 C88 14, 90 9, 96 8 C99 8, 100 11, 99 14 L96 29 C76 37, 34 39, 16 31Z" fill="#9A1B2C" stroke="#7A1220" stroke-width="1"/>
        <circle cx="15" cy="11" r="2.4" fill="#C9A227"/>
        <path d="M18 28 C40 34, 72 33, 95 25" fill="none" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/>
        <!-- runners -->
        <path d="M30 35 L28 43" stroke="#C9A227" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M76 33 L78 41" stroke="#C9A227" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M100 41 L16 44 C7 44, 3 38, 6 33 C8 29, 13 30, 13 33" fill="none" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- Santa -->
      <g transform="translate(226,46)">
        <!-- body -->
        <ellipse cx="22" cy="36" rx="16" ry="14" fill="#9A1B2C"/>
        <!-- arm wave -->
        <path d="M34 32 Q48 20 54 14" fill="none" stroke="#9A1B2C" stroke-width="6" stroke-linecap="round"/>
        <circle cx="55" cy="13" r="4" fill="#F4D0B0"/>
        <!-- mittens cuff -->
        <circle cx="50" cy="16" r="3" fill="#FFF6E8"/>
        <!-- head -->
        <circle cx="22" cy="18" r="12" fill="#F4D0B0"/>
        <!-- beard -->
        <path d="M12 20 Q22 40 32 20 Q28 32 22 34 Q16 32 12 20Z" fill="#FFF8EE"/>
        <path d="M16 20 Q22 28 28 20" fill="#fff"/>
        <!-- mustache -->
        <path d="M14 22 Q22 28 30 22 Q22 24 14 22Z" fill="#FFF8EE"/>
        <!-- eyes -->
        <circle cx="17.5" cy="17" r="1.4" fill="#17241E"/>
        <circle cx="24.5" cy="17" r="1.4" fill="#17241E"/>
        <!-- nose -->
        <ellipse cx="21" cy="20.5" rx="2.2" ry="1.6" fill="#E07A6A"/>
        <!-- cheeks -->
        <circle cx="15" cy="20" r="2" fill="#F0A090" opacity="0.7"/>
        <circle cx="28" cy="20" r="2" fill="#F0A090" opacity="0.7"/>
        <!-- hat -->
        <path d="M10.5 13 C11 4, 18 0, 26 1 C33 2, 38 6, 40 12 C36 9, 32 9, 31 13 Z" fill="#9A1B2C"/>
        <rect x="9" y="11" width="26" height="5.5" rx="2.75" fill="#FFF6E8"/>
        <circle cx="40" cy="12.5" r="3.6" fill="#FFF6E8"/>
        <!-- belt -->
        <rect x="10" y="38" width="24" height="4" fill="#17241E"/>
        <rect x="19" y="37.5" width="6" height="5" fill="#C9A227"/>
      </g>
    </svg>

    <main id="app"></main>

    <p class="footnote" id="footnote"></p>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
